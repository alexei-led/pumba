log-level: warn
template: testify
template-data:
  unroll-variadic: true

packages:
  github.com/alexei-led/pumba/pkg/chaos:
    config:
      dir: "{{.ConfigDir}}/mocks"
      filename: "ChaosCommand.go"
      pkgname: mocks
      structname: "{{.InterfaceName}}"
    interfaces:
      Command:

  # Mockery v3 does not generate named function types. The existing
  # mock_FilterFunc.go remains for source compatibility but is not regenerated.
  github.com/alexei-led/pumba/pkg/container:
    config:
      dir: "{{.ConfigDir}}/pkg/container"
      filename: "mock_{{.InterfaceName}}.go"
      pkgname: container
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      Client:
      Lister:
      Lifecycle:
      Executor:
      Netem:
      IPTables:
      Stressor:

  github.com/docker/docker/client:
    config:
      dir: "{{.ConfigDir}}/mocks"
      filename: "{{.InterfaceName}}.go"
      pkgname: mocks
      structname: "{{.InterfaceName}}"
    interfaces:
      ContainerAPIClient:
      ImageAPIClient:
      APIClient:

  github.com/alexei-led/pumba/pkg/runtime/containerd:
    config:
      dir: "{{.ConfigDir}}/pkg/runtime/containerd"
      filename: "mock_{{.InterfaceName}}.go"
      pkgname: containerd
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      apiClient:

  github.com/containerd/containerd/v2/client:
    config:
      dir: "{{.ConfigDir}}/pkg/runtime/containerd"
      filename: "mock_{{.InterfaceName}}_test.go"
      pkgname: containerd
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      Container:
      Task:
      Process:
      Image:

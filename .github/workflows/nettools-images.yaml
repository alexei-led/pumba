name: Build and Push Network Tools Images
on:
  push:
    branches:
      - master
      - main
    paths:
      - docker/alpine-nettools.Dockerfile
      - docker/debian-nettools.Dockerfile
      - .github/workflows/nettools-images.yaml
  pull_request:
    paths:
      - docker/alpine-nettools.Dockerfile
      - docker/debian-nettools.Dockerfile
      - .github/workflows/nettools-images.yaml
  workflow_dispatch:
jobs:
  build-pr:
    name: Validate Image (${{ matrix.image }}, ${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [alpine-nettools, debian-nettools]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build without Publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pumba-nettools:test
          cache-from: type=gha,scope=${{ matrix.image }}-linux/${{ matrix.arch }}
      - name: Verify Tools
        run: |
          docker run --rm --entrypoint tc pumba-nettools:test -V
          docker run --rm --entrypoint iptables pumba-nettools:test --version
          docker run --rm --entrypoint iptables-nft pumba-nettools:test --version
          docker run --rm --entrypoint iptables-legacy pumba-nettools:test --version
          docker run --rm --entrypoint awk pumba-nettools:test 'BEGIN { exit 0 }'
  build-and-push:
    name: Build and Push
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine - AMD64
          - image: alpine-nettools
            file: docker/alpine-nettools.Dockerfile
            base: alpine
            platform: linux/amd64
            runner: ubuntu-24.04
          # Alpine - ARM64
          - image: alpine-nettools
            file: docker/alpine-nettools.Dockerfile
            base: alpine
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # Debian - AMD64
          - image: debian-nettools
            file: docker/debian-nettools.Dockerfile
            base: debian
            platform: linux/amd64
            runner: ubuntu-24.04
          # Debian - ARM64
          - image: debian-nettools
            file: docker/debian-nettools.Dockerfile
            base: debian
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pumba-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=${{ matrix.base }}
            type=sha,format=short
      - name: Build and Push by Digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/pumba-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          provenance: true
          sbom: true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$DIGEST"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.runner }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1
  merge-manifests:
    name: Merge Manifests
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      matrix:
        image:
          - alpine-nettools
          - debian-nettools
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pumba-${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=${{ matrix.image == 'alpine-nettools' && 'alpine' || 'debian' }}
            type=sha,format=short
      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          readarray -t sources < <(printf 'ghcr.io/${{ github.repository_owner }}/pumba-${{ matrix.image }}@sha256:%s\n' *)
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$META_TAGS"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Inspect image
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag=$(printf '%s\n' "$META_TAGS" | head -n1 | cut -d, -f1)
          docker buildx imagetools inspect "$tag"

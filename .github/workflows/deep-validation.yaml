name: Deep Validation
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deep:
    name: Deep (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [race, advanced]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum
      - name: Race Tests
        if: matrix.mode == 'race'
        run: make test-race
      - name: Prepare Advanced Tests
        if: matrix.mode == 'advanced'
        run: |
          make build
          sudo install -m 755 .bin/github.com/alexei-led/pumba /usr/local/bin/pumba
          docker pull alpine:latest
          docker pull nicolaka/netshoot:latest
          docker pull ghcr.io/alexei-led/pumba-alpine-nettools:latest
          docker pull ghcr.io/alexei-led/stress-ng:0.20.01
          CGO_ENABLED=0 go test -c -tags integration -o "$RUNNER_TEMP/advanced.test" ./tests/integration
      - name: Advanced Runtime Tests
        if: matrix.mode == 'advanced'
        run: sudo env "PATH=$PATH" "$RUNNER_TEMP/advanced.test" -test.v -test.timeout=10m -test.parallel=1

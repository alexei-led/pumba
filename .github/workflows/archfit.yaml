# Archfit: check this change and send the result to the Archfit App at
# https://app.coupling.dev, which decides the archfit/gate check.
#
# The only step is the Archfit Action, pinned to the v4.0.0 release commit. The
# Action checks out the change itself without persisting credentials, runs the
# pinned engine image, and checks the pull request head, pushed commit or merge
# group commit against the target branch's policy. It uploads the result with the
# job's GitHub OIDC token (id-token: write), uses no repository secret and runs no
# repository script. pull_request, branch push and the default branch's merge
# queue (merge_group) are accepted; every other event is refused before checkout.
name: archfit

on:
  pull_request:
  push:
    branches:
      - "master"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  id-token: write

jobs:
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: coupling-dev/archfit-action@53e0c49d80627efa4262d7ee78c56dd6054a6e43 # v0.9.0
        with:
          endpoint: "https://app.coupling.dev"
          audience: "https://app.coupling.dev"

# Archfit advisory feedback. Generated by the Archfit App; change it only by pull request.
#
# The only step is the Archfit Action, pinned to a commit. It runs the pinned engine image and
# reads the trusted inputs .archfit.yaml, .archfit-baseline.json and .archfit-labels.yaml per file
# from git: on a pull request, each file comes from the pull request head when the pull request
# changes that file, and otherwise from the tip of the base branch. A merge-group run reads them
# from the group commit; a push or dispatch run reads them from the branch it ran on. The App
# accepts candidate inputs only after the appropriate architecture-owner approval. The Action
# fills the upload envelope's baseline_digest and labels_digest (bare hex SHA-256, "" when the
# file is absent) from exactly the files the engine read. It uses no repository secret and runs
# no repository script. Uploads are authenticated with the job's GitHub OIDC token (id-token: write).
#
# The Action runs on pull_request, push, merge_group and workflow_dispatch only and refuses every
# other event. Merge-group reports gate the default branch's queue on the group commit.
# A dispatch runs discovery (a proposed policy), baseline (accepted debt) or reanchor (accepted debt
# carried into a new measurement epoch). Baseline and reanchor are proposed as pull requests that
# an architecture owner approves, on the default branch only.
name: archfit

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - "master"
  workflow_dispatch:
    inputs:
      mode:
        description: What a dispatched run does. Reports come from pull_request, merge_group and push runs, so a dispatch picks discovery, baseline or reanchor
        type: choice
        options:
          - report
          - discovery
          - baseline
          - reanchor
        default: report

permissions:
  contents: read
  id-token: write

jobs:
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: alexei-led/archfit-action@2221f4bfece0725a657414fed751cdc090ba1bd4 # v3.1.1
        with:
          endpoint: "https://app.coupling.dev"
          audience: "https://app.coupling.dev"
          mode: ${{ inputs.mode }}

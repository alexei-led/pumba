name: Build and Test
on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
# Cancel superseded runs on the same PR — pushing a new commit invalidates
# the previous build's signal.
concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Classify Changes
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Docs-only Changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # Include both paths of renames; preserve unusual filenames.
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" -- > "$RUNNER_TEMP/changed-files"
            docs_only=true
            while IFS= read -r -d '' file; do
              case "$file" in
                docs/* | deploy/* | examples/*) ;;
                */*) docs_only=false; break ;;
                *.md) ;;
                *) docs_only=false; break ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  unit:
    name: Unit and Lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go Environment
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum
      - name: Run golangci-lint
        if: needs.changes.outputs.docs_only != 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
      - name: Check Test Assertions
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          args: --config=.golangci-tests.yaml
      - name: Run Test Coverage
        if: needs.changes.outputs.docs_only != 'true'
        run: make test-coverage
      - name: Run Offline Shell Tests
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          make test-shell
          test -s .cover/coverage.xml
      - name: Test govulncheck Gate
        if: needs.changes.outputs.docs_only != 'true'
        run: bash .github/scripts/test_govulncheck.bash
      - name: Run govulncheck
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          # Bash and jq are provided by ubuntu-latest.
          # Exact daemon advisory applicability and JSON exit contract: docs/security.md.
          bash .github/scripts/govulncheck.bash 2>&1 | tee govulncheck.txt
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        if: always() && needs.changes.outputs.docs_only != 'true'
        with:
          files: .cover/tests.xml
          commit: ${{ github.sha }}
      - name: Upload Coverage to Codecov
        if: needs.changes.outputs.docs_only != 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: .cover/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
  architecture-profile:
    name: Pinned Archfit Profile
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the local entry point on native amd64
        env:
          DOCKER_CONTEXT: default
        run: |
          # Exercise the fresh-checkout common-dir layout before creating any
          # linked worktree registration, then verify the linked layout too.
          for layout in checkout linked; do
            if [[ "$layout" == linked ]]; then
              git worktree add --detach "$RUNNER_TEMP/archfit-linked" HEAD
              root="$RUNNER_TEMP/archfit-linked"
            else
              root="$GITHUB_WORKSPACE"
            fi
            result=0
            report="$RUNNER_TEMP/archfit-profile-$layout.json"
            bash "$root/.github/scripts/archfit-check.bash" --format json > "$report" || result=$?
            case "$result" in
              0|2) ;;
              *) exit "$result" ;;
            esac
            jq -e --slurpfile reference "$root/.archfit-baseline.json" '
              .gate_reference.status == "comparable" and
              .gate_reference.baseline_present and
              .decision.hard_gates == "pass" and
              ((.decision.unevaluated_required_rules // []) | length == 0) and
              (.comparison.measurement_profile == $reference[0].state.measurement_profile)
            ' "$report"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: archfit-local-profile
          path: ${{ runner.temp }}/archfit-profile-*.json
          if-no-files-found: error
  integration:
    name: Integration Tests (${{ matrix.runtime }}, ${{ matrix.platform }}, shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - docker
          - containerd
          - podman
        platform:
          - linux/amd64
          - linux/arm64
        shard:
          - 1
          - 2
        exclude:
          - runtime: containerd
            shard: 2
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      BATS_LOG: /tmp/bats-${{ matrix.runtime }}.log
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum
      - name: Build and Install Pumba
        run: |
          make build TARGETARCH="$(dpkg --print-architecture)"
          sudo install -m 755 .bin/github.com/alexei-led/pumba /usr/local/bin/pumba
      - name: Install Bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          support-path: /usr/local/lib/bats-support
          assert-path: /usr/local/lib/bats-assert
          detik-install: false
          file-install: false
      - name: Select Integration Files
        env:
          TEST_RUNTIME: ${{ matrix.runtime }}
          TEST_SHARD: ${{ matrix.shard }}
        run: bash .github/scripts/integration-files.bash "$TEST_RUNTIME" "$TEST_SHARD" > "$RUNNER_TEMP/bats-files"
      # ── Docker runtime ────────────────────────────────────────────────────
      - name: Setup Docker Runtime
        if: matrix.runtime == 'docker'
        run: |
          docker pull alpine:latest &
          docker pull ghcr.io/alexei-led/pumba-alpine-nettools:latest &
          wait
          # Build locally so status's mixed-backend regression runs on both arches.
          docker build -t ghcr.io/alexei-led/pumba-debian-nettools:latest -f docker/debian-nettools.Dockerfile .
          docker pull ghcr.io/alexei-led/stress-ng:0.20.01
          # Warm up: exercise the nettools sidecar flow once so the first
          # netem test doesn't pay container-create latency.
          cid=$(docker create --rm alpine:latest sleep 10)
          docker run --rm --net="container:${cid}" \
            ghcr.io/alexei-led/pumba-alpine-nettools:latest true 2>/dev/null || true
          docker rm -f "${cid}" 2>/dev/null || true
      - name: Run Docker Integration Tests
        if: matrix.runtime == 'docker'
        timeout-minutes: 15
        run: |
          set -o pipefail
          files=()
          while IFS= read -r file; do files+=("$file"); done < "$RUNNER_TEMP/bats-files"
          sudo env "PATH=$PATH" bats --tap --timing --print-output-on-failure \
            "${files[@]}" 2>&1 | tee "$BATS_LOG"
      # ── Containerd runtime ────────────────────────────────────────────────
      - name: Setup Containerd Runtime
        if: matrix.runtime == 'containerd'
        env:
          CONTAINERD_VERSION: 2.0.4
        run: |
          if ! command -v ctr &>/dev/null; then
            arch=$(dpkg --print-architecture)
            url="https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-${arch}.tar.gz"
            curl -fsSL "$url" | sudo tar -xz -C /usr/local
          fi
          if ! systemctl is-active --quiet containerd 2>/dev/null; then
            sudo mkdir -p /etc/containerd
            containerd config default | sudo tee /etc/containerd/config.toml >/dev/null
            sudo systemctl enable --now containerd || sudo containerd &
            sleep 2
          fi
          sudo ctr version
          docker pull alpine:latest &
          docker pull ghcr.io/alexei-led/pumba-alpine-nettools:latest &
          docker pull docker.io/nicolaka/netshoot:latest &
          docker pull ghcr.io/alexei-led/stress-ng:0.20.01 &
          wait
      - name: Run Containerd Integration Tests
        if: matrix.runtime == 'containerd'
        run: |
          set -o pipefail
          test -S /run/containerd/containerd.sock
          files=()
          while IFS= read -r file; do files+=("$file"); done < "$RUNNER_TEMP/bats-files"
          sudo env "PATH=$PATH" bats --tap --timing --print-output-on-failure \
            "${files[@]}" 2>&1 | tee "$BATS_LOG"
      # ── Podman runtime ────────────────────────────────────────────────────
      - name: Setup Podman Runtime
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          sudo install -d /etc/containers/containers.conf.d
          printf '[engine]\nlock_type = "file"\n' | sudo tee /etc/containers/containers.conf.d/99-ci-locks.conf >/dev/null
          sudo systemctl enable --now podman.socket
          sudo podman info
          sudo podman pull docker.io/library/alpine:latest &
          sudo podman pull ghcr.io/alexei-led/pumba-alpine-nettools:latest &
          sudo podman pull ghcr.io/alexei-led/stress-ng:0.20.01 &
          sudo podman pull docker.io/nicolaka/netshoot:latest &
          wait
      - name: Run Podman Integration Tests
        if: matrix.runtime == 'podman'
        run: |
          set -o pipefail
          # skip=true also protects user containers, not just Pumba sidecars.
          canary=$(sudo podman run -d --label com.gaiaadm.pumba.skip=true docker.io/library/alpine:latest top)
          trap 'sudo podman rm -f "$canary" >/dev/null 2>&1 || true' EXIT
          files=()
          while IFS= read -r file; do files+=("$file"); done < "$RUNNER_TEMP/bats-files"
          suite_status=0
          sudo env "PATH=$PATH" bats --tap --timing --print-output-on-failure \
            "${files[@]}" 2>&1 | tee "$BATS_LOG" || suite_status=$?
          canary_status=0
          test "$(sudo podman inspect -f '{{.State.Running}}' "$canary")" = true || canary_status=1
          if [ "$suite_status" -ne 0 ]; then exit "$suite_status"; fi
          exit "$canary_status"
      # ── Failure diagnostics (shared across runtimes) ──────────────────────
      - name: Collect Diagnostics on Failure
        if: failure()
        run: |
          DIAG=/tmp/diag
          mkdir -p "$DIAG"
          # Runtime state
          case "${{ matrix.runtime }}" in
            docker)
              docker ps -a 2>&1 | tee "$DIAG/ps.log" >/dev/null
              docker system info 2>&1 | tee "$DIAG/info.log" >/dev/null ;;
            containerd)
              sudo ctr c ls 2>&1 | tee "$DIAG/ps.log" >/dev/null
              sudo journalctl -u containerd --no-pager 2>&1 | tee "$DIAG/journal.log" >/dev/null || true ;;
            podman)
              sudo podman ps -a 2>&1 | tee "$DIAG/ps.log" >/dev/null
              sudo journalctl -u podman.socket --no-pager 2>&1 | tee "$DIAG/journal.log" >/dev/null || true ;;
          esac
          # Always copy the bats log if it exists
          [ -f "$BATS_LOG" ] && cp "$BATS_LOG" "$DIAG/bats.log" || true
      - name: Upload Diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Artifact names forbid `/` — use runner tag (already encodes arch).
          name: integration-${{ matrix.runtime }}-${{ matrix.runner }}-${{ matrix.shard }}-diag
          path: /tmp/diag/
          retention-days: 7
          if-no-files-found: ignore
  gate:
    name: Lint and Test
    needs:
      - changes
      - unit
      - integration
      - architecture-profile
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require All Checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          ARCHITECTURE_PROFILE_RESULT: ${{ needs.architecture-profile.result }}
        run: bash .github/scripts/ci-gate.bash

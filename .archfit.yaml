# Archfit config — approved architecture baseline, 2026-10-29 (engine v3.4.0).
# The module graph below is frozen: depends_on lists record every allowed
# cross-module edge. A new edge, cycle, or layer back-edge fails the gate.
version: 2
target_branch: master

coupling:
  min_severity: medium
  duplicated_knowledge: score
  volatility_cascade: true
  gate:
    distributed_monolith:
      mode: fail
      max_new_seams: 0

# New production code outside every module is unreadable to the rules; make it
# block instead of passing silently.
module_review:
  change_gate: fail

ai:
  provider: anthropic
  model: claude-opus-4-8

languages:
  go:
    enabled: true
  python:
    enabled: false
  typescript:
    enabled: false

analyzers:
  syntax:
    enabled: true
  scip:
    enabled: true
  clones:
    enabled: true

layers:
  - core
  - cmd

modules:
  cmd:
    owner: alexei-led
    paths:
      - "cmd/**"
    public:
      - "cmd"
    layer: cmd
    role: composition_root
    subdomain: supporting
    volatility: low
    depends_on: [pkg_chaos, pkg_container, pkg_runtime]
  pkg_chaos:
    owner: alexei-led
    paths:
      - "pkg/chaos/**"
    public:
      - "pkg/chaos"
      - "pkg/chaos/cliflags"
      - "pkg/chaos/*/cmd"
    layer: core
    subdomain: core
    volatility: high
    depends_on: [pkg_container, pkg_util]
  pkg_container:
    owner: alexei-led
    paths:
      - "pkg/container/**"
    public:
      - "pkg/container"
    layer: core
    subdomain: core
    volatility: medium
    depends_on: []
  pkg_runtime:
    owner: alexei-led
    paths:
      - "pkg/runtime/**"
    public:
      - "pkg/runtime/*"
    layer: core
    subdomain: core
    volatility: high
    depends_on: [pkg_container, pkg_tc]
    visible_to: [cmd]
  pkg_tc:
    owner: alexei-led
    paths:
      - "pkg/tc/**"
    public:
      - "pkg/tc"
    layer: core
    subdomain: core
    volatility: high
    depends_on: []
  pkg_util:
    owner: alexei-led
    paths:
      - "pkg/util/**"
    public:
      - "pkg/util"
    layer: core
    subdomain: supporting
    volatility: low
    depends_on: []

rules:
  - id: approved-module-graph
    type: module_dependencies
    gate: fail
    rationale: >-
      The module graph is the approved architecture. A new cross-module edge
      changes it and needs an owner-approved policy change first, not a code PR.

  - id: no-module-cycles
    type: module_cycle
    gate: fail
    rationale: >-
      A cycle between modules makes them one unit: neither can change or be
      tested alone.

  - id: no-container-to-chaos
    type: forbidden_dependency
    from: pkg/container/**
    to: pkg/chaos/**
    gate: fail
    rationale: >-
      pkg/container is the domain model that chaos consumes. Importing chaos
      inverts the dependency and couples the model to every chaos action.

  - id: no-chaos-to-runtime
    type: forbidden_dependency
    from: pkg/chaos/**
    to: pkg/runtime/**
    gate: fail
    rationale: >-
      Chaos says what to do through the container.Client interface; runtime
      adapters say how. A direct import bypasses the interface and ties chaos
      actions to one runtime.

  - id: no-util-to-domain
    type: forbidden_dependency
    from: pkg/util/**
    to: pkg/chaos/**
    gate: fail
    rationale: >-
      pkg/util must stay domain-agnostic so any package can use it without
      pulling in chaos behavior.

  - id: layer-inversion
    type: forbidden_layer_direction
    gate: fail
    rationale: >-
      cmd is the composition root. A core package that imports it creates a
      cycle with the wiring and cannot be reused or tested without the CLI.
